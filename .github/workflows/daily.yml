name: internbot

on:
  schedule:
    # GitHub cron is UTC. Toronto is UTC-4 (EDT) or UTC-5 (EST), so trigger on the UTC hours
    # that cover 06:00-22:00 Toronto in both seasons; the guard step below picks the exact runs.
    - cron: "17 0-3,10-23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write # push the seen-jobs DB to the `state` branch

concurrency:
  group: internbot
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Guard (Toronto time slots)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          hour=$(TZ=America/Toronto date +%-H)
          dow=$(TZ=America/Toronto date +%u)
          # Mon-Fri: 06,08,...,22   Sat-Sun: 08,12,16,20
          if [ "$dow" -le 5 ]; then
            slots=" 6 8 10 12 14 16 18 20 22 "
          else
            slots=" 8 12 16 20 "
          fi
          case "$slots" in
            *" $hour "*) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT"
               echo "Toronto hour=$hour dow=$dow: not a scheduled slot, skipping" ;;
          esac

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Restore seen-jobs DB from the state branch
        if: steps.guard.outputs.run == 'true'
        run: |
          if git fetch --depth=1 origin state 2>/dev/null; then
            git show FETCH_HEAD:seen_jobs.db > seen_jobs.db
            echo "Restored seen_jobs.db"
          else
            echo "No state branch yet; starting with an empty DB"
          fi

      - name: Run internbot
        if: steps.guard.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python -m internbot.main

      - name: Save seen-jobs DB to the state branch
        if: steps.guard.outputs.run == 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git fetch --depth=1 origin state 2>/dev/null \
             && git show FETCH_HEAD:seen_jobs.db | cmp -s - seen_jobs.db; then
            echo "DB unchanged; nothing to save"; exit 0
          fi
          dir=$(mktemp -d)
          cp seen_jobs.db "$dir/"
          cd "$dir"
          git init -q -b state
          git add seen_jobs.db
          git -c user.name="internbot" -c user.email="internbot@users.noreply.github.com" \
            commit -q -m "Update seen jobs"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" state
