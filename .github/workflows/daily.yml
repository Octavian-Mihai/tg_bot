name: internbot

on:
  schedule:
    # GitHub cron is UTC-only, runs late and sometimes not at all, so it is not trusted to hit
    # the exact times. The workflow wakes every 15 minutes and `internbot.schedule` decides
    # whether a slot from settings.toml has come due and not yet run. A slot GitHub skipped is
    # caught up at the next wake-up, and a failed one is retried.
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # "Run workflow" button, and the Telegram keyword (see listen.yml)

permissions:
  contents: write # push the seen-jobs DB to the `state` branch

concurrency:
  group: internbot
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Restore seen-jobs DB from the state branch
        run: |
          if git fetch --depth=1 origin state 2>/dev/null; then
            git show FETCH_HEAD:seen_jobs.db > seen_jobs.db
            echo "Restored seen_jobs.db"
          else
            echo "No state branch yet; starting with an empty DB"
          fi

      - name: Is a run due?
        id: due
        run: |
          manual=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then manual="--manual"; fi
          python3 -m internbot.schedule check $manual

      - uses: actions/setup-python@v7
        if: steps.due.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.due.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run internbot
        if: steps.due.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python -m internbot.main

      - name: Mark the slot done
        if: success() && steps.due.outputs.run == 'true'
        run: python -m internbot.schedule done --slot "${{ steps.due.outputs.slot }}"

      - name: Count the failed attempt and tell me
        if: failure() && steps.due.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m internbot.schedule failed --slot "${{ steps.due.outputs.slot }}"

      - name: Save seen-jobs DB to the state branch
        if: always() && steps.due.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git fetch --depth=1 origin state 2>/dev/null \
             && git show FETCH_HEAD:seen_jobs.db | cmp -s - seen_jobs.db; then
            echo "DB unchanged; nothing to save"; exit 0
          fi
          dir=$(mktemp -d)
          cp seen_jobs.db "$dir/"
          cd "$dir"
          git init -q -b state
          git add seen_jobs.db
          git -c user.name="internbot" -c user.email="internbot@users.noreply.github.com" \
            commit -q -m "Update seen jobs"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" state
