# Company job boards to watch (public Greenhouse / Lever APIs, no keys needed).
# Add a company: find its board slug in the careers URL
#   boards.greenhouse.io/<slug>   or   jobs.lever.co/<slug>
# Only jobs whose location matches one of `locations` are kept.

